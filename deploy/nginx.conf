# StockA 反向代理配置
# 使用方法: nginx -c /path/to/deploy/nginx.conf

upstream gin_up {
    server 127.0.0.1:8080;
}

upstream agent_up {
    server 127.0.0.1:8000;
}

# WebSocket 连接限流 zone
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

server {
    listen 80;
    server_name _;

    # 普通 API：保持默认缓冲
    location /api/ {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # 健康检查
    location /healthz {
        proxy_pass http://gin_up;
    }

    # 静态资源
    location /uploads/ {
        proxy_pass http://gin_up;
    }

    # WebSocket（小程序主链路）
    location /api/v1/ws/agent {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        gzip off;
        limit_conn ws_per_ip 20;
    }

    # 旧版 WebSocket（提醒推送）
    location /api/v1/ws {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        gzip off;
    }

    # SSE（H5 兼容链路）
    location /api/v1/agent/stream {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache, no-transform";
    }

    # Python Agent 服务直连（内部调试用，生产环境应移除）
    location /agent-internal/ {
        proxy_pass http://agent_up/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
