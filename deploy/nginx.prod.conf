# StockA 生产反代（阶段一：服务器 IP + 自签名证书）
#
# 安装（scripts/deploy.sh deploy 会自动做）：
#   cp deploy/nginx.prod.conf /etc/nginx/conf.d/stock-agent.conf
#   rm -f /etc/nginx/sites-enabled/default     # 去掉 Ubuntu 默认站，避免 80 端口抢占
#   nginx -t && systemctl reload nginx
#
# 阶段二换成域名 + Let's Encrypt 证书时只需改三处（README.prod.md 有完整步骤）：
#   1. 两个 server 块的 server_name _;        -> 你的域名
#   2. ssl_certificate / ssl_certificate_key  -> certbot 签发的证书路径
#   3. 删掉本文件头部「阶段一」注释
#
# 代理规则与本地开发版 deploy/nginx.conf 一致（WebSocket / SSE / 普通 API 分流），
# 差异：443 + 自签证书、限流 zone、上传体积放大、去掉 agent-internal（agent 容器
# 不对宿主暴露端口，调试请用 docker compose exec）。

upstream gin_up {
    server 127.0.0.1:8080;
}

# WebSocket 连接限流 zone
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

# ---- 80：仅保留 ACME 验证入口（阶段二 certbot webroot 模式用），其余跳 HTTPS ----
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # 阶段一：自签名证书（deploy.sh 生成，SAN 带服务器公网 IP）。
    # 微信开发者工具需勾选「不校验合法域名」（project.config.json 的 urlCheck 已是 false）。
    # 阶段二换成 certbot 路径：/etc/letsencrypt/live/<域名>/fullchain.pem 与 privkey.pem
    ssl_certificate     /etc/nginx/ssl/stock-agent.crt;
    ssl_certificate_key /etc/nginx/ssl/stock-agent.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 语音上传（ASR 音频）放宽请求体上限
    client_max_body_size 20m;

    # 普通 API：保持默认缓冲
    location /api/ {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # 健康检查（探活/部署验证用）
    location /healthz {
        proxy_pass http://gin_up;
    }

    # 静态资源
    location /uploads/ {
        proxy_pass http://gin_up;
    }

    # WebSocket（小程序主链路）
    location /api/v1/ws/agent {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        gzip off;
        limit_conn ws_per_ip 20;
    }

    # 旧版 WebSocket（提醒推送）
    location /api/v1/ws {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        gzip off;
    }

    # SSE（H5 兼容链路）
    location /api/v1/agent/stream {
        proxy_pass http://gin_up;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache, no-transform";
    }
}
