# 本地开发依赖：PostgreSQL(pgvector) + Redis + Agent(Python) [+ Ingest]
#
#   docker compose up -d                       # 启动核心依赖（pg/redis/agent）
#   docker compose --profile ingest up -d      # 附带启动文档 ingest 服务
#   docker compose down                        # 停掉（数据保留在卷里）
#   docker compose down -v                     # 连数据一起清掉
#
# 端口映射到宿主机，与 config.go 里的默认 DSN / Redis 地址一致：
#   postgres://postgres:postgres@localhost:5432/stock_agent?sslmode=disable
#   127.0.0.1:6379
#   agent: http://localhost:8000
#
# 说明：
#   postgres 镜像使用 pgvector/pgvector:pg16（内置 vector 扩展），
#   migrations/005_agent.sql 里的 CREATE EXTENSION vector 依赖此镜像。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stock-agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_agent
      TZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 仅首次初始化（数据目录为空时）执行，之后改表请用新的迁移文件
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stock_agent']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: stock-agent-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30

  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: stock-agent-python
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stock_agent?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.siliconflow.cn/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-ai/DeepSeek-V3}
      SMALL_MODEL: ${SMALL_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      # Tushare Pro 数据增强 token（财务/资金流/龙虎榜/北向/资讯/历史K线）；
      # 为空时这些工具不注册，agent 仅用 Go 网关行情
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      # Agent 工具回调 Go 网关：容器内 127.0.0.1 指向自身，
      # 必须用 host.docker.internal 才能访问跑在宿主机上的 Go server
      GO_SERVER_URL: ${GO_SERVER_URL:-http://host.docker.internal:8080}
      # 回调 /api/v1/stocks/search 等受保护接口需带合法 JWT，留空则工具必然 401
      GO_SERVER_TOKEN: ${GO_SERVER_TOKEN:-}
    # host.docker.internal 在 Docker Desktop 内置可解析；
    # host-gateway 保证 Linux 宿主上也能解析到宿主机
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest:
    build:
      context: ../ingest
      dockerfile: Dockerfile
    container_name: stock-agent-ingest
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stock_agent?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WATCH_DIR: /data/docs
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      # ingest 默认未装 FlagEmbedding，会走 OpenAI 兼容降级路径，故必须给齐下面几项；
      # embedding 模型要与 agent 端一致（同为 1024 维 bge-m3），否则向量空间不匹配
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.siliconflow.cn/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-BAAI/bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
    volumes:
      - ingestdata:/data/docs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - ingest

volumes:
  pgdata:
  redisdata:
  ingestdata:
