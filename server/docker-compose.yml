# 本地开发依赖：PostgreSQL(pgvector) + Redis + Agent(Python) [+ Ingest]
#
#   docker compose up -d                       # 启动核心依赖（pg/redis/agent）
#   docker compose --profile ingest up -d      # 附带启动文档 ingest 服务
#   docker compose down                        # 停掉（数据保留在卷里）
#   docker compose down -v                     # 连数据一起清掉
#
# 端口映射到宿主机，与 config.go 里的默认 DSN / Redis 地址一致：
#   postgres://postgres:postgres@localhost:5432/stock_agent?sslmode=disable
#   127.0.0.1:6379
#   agent: http://localhost:8000
#
# 说明：
#   postgres 镜像使用 pgvector/pgvector:pg16（内置 vector 扩展），
#   migrations/005_agent.sql 里的 CREATE EXTENSION vector 依赖此镜像。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stock-agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_agent
      TZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 仅首次初始化（数据目录为空时）执行，之后改表请用新的迁移文件
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stock_agent']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: stock-agent-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30

  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: stock-agent-python
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stock_agent?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      SMALL_MODEL: ${SMALL_MODEL:-gpt-4o-mini}
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest:
    build:
      context: ../ingest
      dockerfile: Dockerfile
    container_name: stock-agent-ingest
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stock_agent?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WATCH_DIR: /data/docs
      EMBED_MODEL: BAAI/bge-m3
    volumes:
      - ingestdata:/data/docs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - ingest

volumes:
  pgdata:
  redisdata:
  ingestdata:
